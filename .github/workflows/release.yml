name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v0.1.0)
        required: true
        type: string
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_TAG"
          else
            tag="$(cat RELEASE_VERSION)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          existing="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          tagged_commit="$(printf '%s\n' "$existing" | awk '/\^\{\}$/ { peeled=$1 } NR==1 { direct=$1 } END { print peeled ? peeled : direct }')"
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo 'Release tag points at different source; choose a new version.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  # ===========================================================================
  # BUILD — cross-platform release binaries
  #
  # Every job here re-does the frankentui / frankensqlite sibling checkout,
  # because vc's Cargo.toml carries path dependencies on them and a bare
  # actions/checkout cannot compile the workspace. See .github/workflows/ci.yml
  # for the full rationale.
  # ===========================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64. Built on ubuntu-22.04 (glibc 2.35) rather than
          # ubuntu-latest, so the binary runs on older hosts. dcg solves the
          # same problem with a fully-static musl target, but that is not open
          # to vc: it bundles DuckDB (C++) and links reqwest, so a static musl
          # build would need a musl C++ toolchain and a musl OpenSSL. Pinning
          # an older-glibc runner buys most of the portability for none of the
          # pain. (dcg#114 is the corresponding regression there.)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: vc
          # Linux aarch64. Built on the NATIVE ARM runner rather than
          # cross-compiled, which keeps the bundled DuckDB C++ build honest and
          # makes a wrong-arch artifact impossible by construction. (dcg#112
          # shipped an x86-64 ELF as the aarch64 asset; a native runner is the
          # fix that stuck.)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: vc
          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: vc
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: vc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Keep the dependencies as real siblings. Nesting path crates inside
          # this workspace makes Cargo inherit vc's workspace metadata instead
          # of their own (including license-file and internal dependencies).
          project_root="$(dirname "$GITHUB_WORKSPACE")"
          for spec in \
            frankentui:befbd2471a1ec4a6b8ce0a0df32116c317cca9db \
            frankensqlite:66463dd1012e49f25e617e928e93a3c74ced54e7
          do
            repo="${spec%%:*}"
            revision="${spec#*:}"
            git init "$project_root/$repo"
            git -C "$project_root/$repo" remote add origin "https://github.com/Dicklesworthstone/$repo.git"
            git -C "$project_root/$repo" fetch --depth 1 origin "$revision"
            git -C "$project_root/$repo" checkout --detach FETCH_HEAD
          done

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          targets: ${{ matrix.target }}

      - name: Build release binary
        # The sibling revisions are fixed above. Cargo.lock must be refreshed
        # when those revisions change, since it records path crate versions.
        run: cargo build --release --bin vc --target ${{ matrix.target }}

      - name: Strip binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ ! -f "$binary" ]; then
            echo "::error::expected built binary not found at $binary"
            exit 1
          fi
          before=$(wc -c < "$binary")
          if [ "${{ runner.os }}" = "macOS" ]; then
            # -x strips local symbols only; a full strip breaks codesigning on
            # Apple Silicon (the adhoc signature covers the symbol table).
            strip -x "$binary"
          else
            strip "$binary"
          fi
          after=$(wc -c < "$binary")
          echo "stripped $binary: ${before} -> ${after} bytes"

      # Guard against the class of bug that produced dcg#112 (an x86-64 ELF
      # published as the aarch64 asset). Native runners make this impossible,
      # but the check is nearly free insurance against a future matrix edit.
      - name: Verify binary architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          desc="$(file "$binary")"
          echo "$desc"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              echo "$desc" | grep -q "x86-64" || { echo "::error::expected an x86-64 ELF, got: $desc"; exit 1; } ;;
            aarch64-unknown-linux-gnu)
              echo "$desc" | grep -q "aarch64" || { echo "::error::expected an aarch64 ELF, got: $desc"; exit 1; } ;;
            x86_64-apple-darwin)
              echo "$desc" | grep -q "x86_64" || { echo "::error::expected an x86_64 Mach-O, got: $desc"; exit 1; } ;;
            aarch64-apple-darwin)
              echo "$desc" | grep -q "arm64" || { echo "::error::expected an arm64 Mach-O, got: $desc"; exit 1; } ;;
          esac
          echo "architecture verified for ${{ matrix.target }}"

      # A binary that is the right architecture but crashes on startup must not
      # ship. Every target in this matrix is built on a native runner, so we can
      # actually execute all four.
      - name: Execute binary (--version smoke)
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          "$binary" --version
          "$binary" --help
          echo "smoke test passed"

      - name: Create tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "commit=$GITHUB_SHA"
            rustc -Vv
            git -C "$(dirname "$GITHUB_WORKSPACE")/frankentui" rev-parse HEAD
            git -C "$(dirname "$GITHUB_WORKSPACE")/frankensqlite" rev-parse HEAD
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum Cargo.lock
            else
              shasum -a 256 Cargo.lock
            fi
          } > dist/BUILD_INFO-${{ matrix.target }}.txt
          TARBALL="vc-${{ matrix.target }}.tar.xz"
          cd "target/${{ matrix.target }}/release"
          # Force mode 755 inside the tarball. macOS release builds have been
          # observed emerging as 0700, which breaks the installer's
          # `find ... -perm -111` binary discovery (ee#4).
          chmod 755 "${{ matrix.artifact_name }}"
          tar -cJf "$GITHUB_WORKSPACE/dist/$TARBALL" "${{ matrix.artifact_name }}"
          cd "$GITHUB_WORKSPACE/dist"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$TARBALL" > "$TARBALL.sha256"
          else
            shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          fi
          cat "$TARBALL.sha256"

      - name: Verify extracted archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xJf "dist/vc-${{ matrix.target }}.tar.xz" -C extracted
          test -x extracted/vc
          extracted/vc --version
          extracted/vc --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ===========================================================================
  # RELEASE — aggregate checksums and publish
  # ===========================================================================
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # One aggregate manifest for the installer to consult, alongside the
          # per-artifact .sha256 sidecars the build jobs already produced. The
          # manifest is the `sha256sum -c` format, so users can verify with:
          #   sha256sum -c SHA256SUMS --ignore-missing
          sha256sum vc-*.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Verify SHA256SUMS against the sidecars
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Cross-check the aggregate manifest we just built against the
          # per-artifact sidecars written on four different runners. A mismatch
          # means an artifact was corrupted in transit through the artifact
          # store — better to fail the release than to publish a manifest that
          # disagrees with its own sidecars.
          sha256sum -c SHA256SUMS
          for f in vc-*.tar.xz; do
            expected="$(awk '{print $1}' "$f.sha256")"
            actual="$(awk -v n="$f" '$2 == n || $2 == "*"n {print $1}' SHA256SUMS)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::checksum mismatch for $f: sidecar=$expected manifest=$actual"
              exit 1
            fi
          done
          echo "All artifact checksums agree."

      - name: Copy install script to dist
        run: |
          cp install.sh dist/
          cd dist
          sha256sum install.sh > install.sh.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and execute published Linux x86_64 asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p downloaded installed
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'vc-x86_64-unknown-linux-gnu.tar.xz*' \
            --pattern SHA256SUMS --dir downloaded
          (cd downloaded; sha256sum -c SHA256SUMS --ignore-missing; sha256sum -c vc-*.sha256)
          tar -xJf downloaded/vc-x86_64-unknown-linux-gnu.tar.xz -C installed
          file installed/vc | grep -q 'ELF 64-bit.*x86-64'
          installed/vc --version
          installed/vc --help
